[project]
name = "wdo-market-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devVargas", email = "alissonvargas97@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
]

[project.scripts]
wdo-market-lab = "wdo_market_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
ignore = ["DTZ001"]